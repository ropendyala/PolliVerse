<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="PolliVerse helps neighbors in Apex and New Hill, NC plant native pollinator gardens and connect their yards into a corridor.">
<title>PolliVerse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout concept: one narrow, phone-first column. A guided 5-step plan on top, then Garden / Leaderboard / Corridor tabs. */
:root{
  --bg:#F1F4EE; --surface:#FFFFFF; --ink:#1B2A1F; --muted:#586A5C; --line:#D3DCCE;
  --green:#2F6B3C; --on-green:#FFFFFF; --soft:#E3EEDF;
  --bloom:#A23E7A; --gold:#E3A72F; --gold-ink:#3F2B00; --warn:#9A4A12;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101814; --surface:#18231C; --ink:#E7EFE6; --muted:#9DB0A1; --line:#2A3A2F;
  --green:#6CC081; --on-green:#0C1D11; --soft:#1F3425;
  --bloom:#E583BC; --gold:#F0BE55; --gold-ink:#2B1E00; --warn:#E59A5C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101814; --surface:#18231C; --ink:#E7EFE6; --muted:#9DB0A1; --line:#2A3A2F;
  --green:#6CC081; --on-green:#0C1D11; --soft:#1F3425;
  --bloom:#E583BC; --gold:#F0BE55; --gold-ink:#2B1E00; --warn:#E59A5C; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;padding-block:14px 40px}
.app{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:1.45rem;font-weight:800} h3{font-size:1.1rem;font-weight:600}
p{margin:0} .muted{color:var(--muted)} .small{font-size:.875rem}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--bloom);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.02em}
.brand span{color:var(--bloom)}
.tag{font-size:.85rem;color:var(--muted)}
.pts{background:var(--gold);color:var(--gold-ink);border-radius:999px;padding:6px 14px;font-weight:700;font-variant-numeric:tabular-nums}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:12px}
nav button{border:0;background:transparent;padding:9px 4px;border-radius:9px;font-weight:700;font-size:.875rem}
nav button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:700;color:var(--muted)}
.steps button[aria-current="step"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.steps button:disabled{opacity:.45;cursor:not-allowed}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;background:var(--green);color:var(--on-green)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.bloom{background:var(--bloom);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0;width:100%}
.zip{font-family:var(--display);font-size:1.6rem;letter-spacing:.2em;max-width:11ch;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.tile{text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:3px}
.tile b{font-family:var(--display);font-size:1.05rem}
.tile[aria-pressed="true"]{border-color:var(--green);background:var(--soft)}
.plant{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.plant.on{border-color:var(--green);background:var(--soft)}
.plant header{align-items:flex-start;flex-wrap:nowrap}
.latin{font-style:italic;color:var(--muted);font-size:.85rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:6px 12px;font-size:.875rem}
.facts dt{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.facts dd{margin:0;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--green)}
.chip.hit{background:var(--bloom);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:7px 14px;font-size:.875rem;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.rules{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem;align-items:baseline}
.rules b{font-family:var(--display);color:var(--bloom);font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%}
td,th{padding:9px 6px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
tr.me td{background:var(--soft);font-weight:700}
.wrap{overflow-x:auto}
canvas{width:100%;aspect-ratio:1/1;max-width:100%;border:1px solid var(--line);border-radius:12px;cursor:crosshair;display:block;touch-action:manipulation}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.9rem}
.empty{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.err{color:var(--warn);font-weight:700;font-size:.9rem}
ul.plain{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:6px}
footer{font-size:.8rem;color:var(--muted);text-align:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.ln{display:inline-block;width:18px;height:3px;background:var(--green);vertical-align:middle;margin-right:5px}
.ln.gap{background:repeating-linear-gradient(90deg,#C77A00 0 5px,transparent 5px 9px)}
@media (prefers-reduced-motion:no-preference){.card{animation:rise .25s ease-out}@keyframes rise{from{opacity:.4;transform:translateY(6px)}}}
</style>

</head><body>

  <main id="view"></main>

</div>

/* ---------- State ---------- */
const blank=()=>({v:1,name:"Neighbor "+Math.floor(100+Math.random()*900),zip:"",sun:"",poll:[],plants:[],step:1,planDone:false,
  pts:0,ledger:[],checkedIn:false,pin:null,sightings:[],photoCount:0,showPin:true,named:false});
let demo=false, realState=null, realPlayers=null, S=blank(), photos=[], players=[], uid=null, db=null, mode="local", tab="plan", vs=1, pend=null, noteDraft="", msg="";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toLocaleDateString("en-CA");
function hav(a,b,c,d){const R=3958.8,r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

/* ---------- Persistence ---------- */
const KEY="polliverse.v1";
function lsGet(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}}
function lsSet(){try{localStorage.setItem(KEY,JSON.stringify({S,photos}))}catch(e){}}
const chains={};
function w(path,data){const p=(chains[path]||Promise.resolve()).then(()=>fb.setDoc(fb.doc(fsDb,path),data)).catch(()=>{mode="local";foot()});chains[path]=p;return p}
let lastPub="",timer=null;
const pub=()=>({name:S.name,pts:S.pts,zip:S.zip,sightings:S.sightings.length,plants:S.plants.length,
  pin:S.pin&&S.showPin!==false?(S.pin.map==="jp"?{map:"jp",u:Math.round(S.pin.u*200)/200,v:Math.round(S.pin.v*200)/200}:{lat:+S.pin.lat.toFixed(3),lng:+S.pin.lng.toFixed(3)}):null});
function save(){if(demo){head();return}lsSet();clearTimeout(timer);timer=setTimeout(flush,500);head()}
function flush(){
  if(demo)return;
  if(!(db&&uid)){players=S.planDone?[{id:"me",...pub()}]:[];return}
  w("users/"+uid,S);
  const p=JSON.stringify(pub());
  if(S.planDone&&p!==lastPub){lastPub=p;w("players/"+uid,{...pub(),ts:Date.now()})}
}
function award(key,label,pts){S.pts+=pts;S.ledger.unshift({key,label,pts,ts:Date.now()});S.ledger=S.ledger.slice(0,60);msg="+"+pts+" points: "+label}

/* ---------- Header / footer ---------- */
function head(){$("#ptsChip").textContent=S.pts+" pts"}
function foot(){$("#foot").textContent=demo?"Judge demo with sample data.":mode==="shared"
  ?"Connected. Your progress is saved and the leaderboard shows everyone using PolliVerse."
  :"Saved in this browser only. The shared leaderboard is not connected right now."}

/* ---------- Plan flow ---------- */
const STEPLBL=["ZIP code","Sun","Pollinators","Plants","Where to buy"];
function stepper(){
  return `<div class="steps" role="navigation" aria-label="Plan steps">${STEPLBL.map((l,i)=>{
    const n=i+1,cur=n===vs;
    return `<button data-act="goto" data-n="${n}" ${cur?'aria-current="step"':""} ${n>S.step?"disabled":""}>${n}. ${l}</button>`}).join("")}</div>`}

function matches(p){return p.sun.includes(S.sun)&&p.att.some(a=>S.poll.includes(a))}
function prune(){S.plants=S.plants.filter(sp=>{const p=PLANTS.find(x=>x.id===sp.id);return p&&matches(p)})}

function planView(){
  if(S.planDone&&vs>=6)return donePlan();
  let h=stepper();
  if(vs===1){
    h+=`<section class="card"><h2>Welcome to PolliVerse</h2>
    <p class="muted">Pick a nickname and enter your ZIP code to start. We are testing in Apex and New Hill.</p>
    <form id="zipForm" style="display:flex;flex-direction:column;gap:8px">
    <label class="small muted" for="nick1">Nickname (shown on the leaderboard, not your real name)</label>
    <input type="text" id="nick1" maxlength="20" autocomplete="off" placeholder="BeeBuddy" value="${S.named?esc(S.name):""}">
    <label class="small muted" for="zip">ZIP code</label>
    <input class="zip" id="zip" type="text" inputmode="numeric" maxlength="5" autocomplete="postal-code" placeholder="27562" value="${esc(S.zip)}">
    <div class="row"><button class="btn" type="submit">Start planning</button></div></form>
    <p class="err" id="zipErr">${esc(msg)}</p>
    <div class="row"><button class="btn ghost" data-act="demo">Judge demo: see a sample garden</button></div>
  </section>`;
  }else if(vs===2){
    h+=`<section class="card"><h2>Where will you plant?</h2><p class="muted">Pick the sunniest spot you could use in ${esc(ZIPS[S.zip].n)}.</p>
    <div class="tiles">
      <button class="tile" data-act="sun" data-v="full" aria-pressed="${S.sun==="full"}"><b>Full sun</b><span class="small muted">6 or more hours of direct sun</span></button>
      <button class="tile" data-act="sun" data-v="part" aria-pressed="${S.sun==="part"}"><b>Partial sun</b><span class="small muted">3 to 6 hours of direct sun</span></button>
    </div></section>`;
  }else if(vs===3){
    h+=`<section class="card"><h2>Who do you want to attract?</h2><p class="muted">Choose one or more.</p>
    <div class="tiles">${Object.keys(POLL).map(k=>`<button class="tile" data-act="poll" data-v="${k}" aria-pressed="${S.poll.includes(k)}"><b>${POLL[k].label}</b><span class="small muted">${POLL[k].sub}</span></button>`).join("")}</div>
    <div class="row"><button class="btn" data-act="toPlants" ${S.poll.length?"":"disabled"}>Show native plants</button></div></section>`;
  }else if(vs===4){
    const list=PLANTS.filter(matches).map(p=>({p,k:p.att.filter(a=>S.poll.includes(a)).length})).sort((a,b)=>b.k-a.k||a.p.n.localeCompare(b.p.n));
    h+=`<section class="card"><h2>Apex native plants for you</h2>
    <p class="muted">${list.length} plants for ${S.sun==="full"?"full":"partial"} sun that attract ${S.poll.map(k=>POLL[k].label.toLowerCase()).join(", ")}. Tap to select, then choose soil or pot.</p>

}

/* ---------- Corridor map ---------- */
function geom(){const z=ZIPS[S.zip]||ZIPS["27502"];return{lat0:z.lat,lng0:z.lng,kx:111320*Math.cos(z.lat*Math.PI/180),ky:110574}}
const GAP_MAX=600; // gaps are drawn between groups of yards up to 600 m apart
function gaps(ps){
  const par=ps.map((_,i)=>i),f=i=>par[i]===i?i:(par[i]=f(par[i]));
  ps.forEach((a,i)=>ps.forEach((b,j)=>{if(j>i&&Math.hypot(a.x-b.x,a.y-b.y)<LINK_M)par[f(i)]=f(j)}));
  const best={};
  ps.forEach((a,i)=>ps.forEach((b,j)=>{if(j>i){const ca=f(i),cb=f(j);if(ca===cb)return;
    const d=Math.hypot(a.x-b.x,a.y-b.y);if(d>GAP_MAX)return;const k=ca<cb?ca+"-"+cb:cb+"-"+ca;
    if(!best[k]||d<best[k].d)best[k]={a,b,d,x:(a.x+b.x)/2,y:(a.y+b.y)/2}}}));
  return Object.values(best).sort((p,q)=>p.d-q.d);
}
function pins(){
  const out=[],mine=id=>id===uid||id==="me";
  if(jpMode()){
    const f=p=>({x:(p.u-0.5)*JP.w*JP_M,y:(0.5-p.v)*JP.h*JP_M});
    roster().forEach(p=>{if(p.pin&&p.pin.map==="jp"&&!mine(p.id)&&p.zip===S.zip)out.push({...f(p.pin),me:false})});
    const m=pend||S.pin;if(m&&m.map==="jp")out.push({...f(m),me:true});
    return out}
  const g=geom();
  roster().forEach(p=>{if(p.pin&&p.pin.map!=="jp"&&!mine(p.id)&&p.zip===S.zip)out.push({x:(p.pin.lng-g.lng0)*g.kx,y:(p.pin.lat-g.lat0)*g.ky,me:false})});
  const m=pend||S.pin;if(m&&m.lat!==undefined)out.push({x:(m.lng-g.lng0)*g.kx,y:(m.lat-g.lat0)*g.ky,me:true});
  return out;
}
function mapView(){
  if(!S.zip)return `<section class="card"><h2>Corridor map</h2><div class="empty">Enter your ZIP code in Plan to see your area.</div></section>`;
  const jp=jpMode(),ps=pins(),deg=ps.map((a,i)=>ps.filter((b,j)=>j!==i&&Math.hypot(a.x-b.x,a.y-b.y)<LINK_M).length);
  const linked=deg.filter(d=>d>0).length, mi=ps.findIndex(p=>p.me), gp=gaps(ps);
  let mine=jp?"Tap your lot on the map to see how your yard connects.":"Pin where you planted to see how your yard connects.";
  if(mi>=0){const near=ps.filter((p,j)=>j!==mi).map(p=>Math.hypot(p.x-ps[mi].x,p.y-ps[mi].y)).sort((a,b)=>a-b)[0];
    mine=deg[mi]>0?`Your yard links to ${deg[mi]} neighbor${deg[mi]>1?"s":""}.`
      :near!==undefined?`Your yard stands alone. The nearest pin is about ${Math.round(near*3.281)} ft away. Plants between you and it would close the gap.`
      :"You are the first pin here. Invite neighbors to start a corridor."}
  return `<section class="card"><h2>${jp?"Jordan Pointe corridor map":"Corridor map"}</h2>
  <p class="muted">Each dot is a yard. Lines show yards within ${LINK_M} m (about 800 ft), close enough for pollinators to hop between. Gaps are where new plantings help most.</p>
  <canvas id="map" style="${jp?"aspect-ratio:"+JP.w+"/"+JP.h:""}" role="img" aria-label="Corridor map of planted yards near ${S.zip}"></canvas>
  <div class="row small" style="gap:14px"><span><i class="dot" style="background:var(--bloom)"></i>You</span><span><i class="dot" style="background:var(--green)"></i>Neighbor</span><span><i class="ln"></i>Linked</span><span><i class="ln gap"></i>Gap</span></div>
  <p><b>${ps.length}</b> ${ps.length===1?"yard":"yards"} pinned, <b>${linked}</b> linked. ${mine}</p>
  ${gp.length?`<ul class="plain">${gp.slice(0,3).map(g=>`<li><b>Gap:</b> about ${Math.round(g.d*3.281)} ft between two groups of yards. A planting near the middle (the ring on the map) would link them.</li>`).join("")}</ul>`:(ps.length>1?`<p class="small muted">No gaps to close between the yards shown so far.</p>`:"")}
  ${S.checkedIn?`<div class="row"><button class="btn" data-act="savepin" ${pend?"":"disabled"}>${S.pin?"Move my pin":"Save my pin (+30)"}</button></div>
  <p class="small muted">${jp?"After you plant, tap your lot to drop your pin, then save it.":"Tap the map to place your pin. Or paste coordinates from Google Maps (press and hold on your yard, then tap the numbers)."}</p>
  ${jp?"":`<div class="row"><input type="text" id="coord" placeholder="35.6540, -78.9890" aria-label="Coordinates" style="flex:1"><button class="btn ghost" data-act="coord">Use coordinates</button></div>`}
  <label class="row small" style="gap:8px"><input type="checkbox" data-act="showpin" ${S.showPin!==false?"checked":""}> Show my pin to neighbors (no name, rounded to about 25 ft)</label>
  <p class="err">${esc(msg)}</p>`
  :`<div class="note small">Plant first, then check in under My Garden to place your pin.</div>`}
  <p class="small muted">${jp?"Jordan Pointe parcel map. Distances are approximate.":"This is a planning view, not a street map, centered near "+esc(ZIPS[S.zip].n)+"."} Neighbors see pins as nameless dots.</p></section>`;
}
function drawMap(){
  const c=$("#map");if(!c)return;
  const jp=jpMode(),dpr=window.devicePixelRatio||1,W=c.clientWidth||320,H=jp?Math.round(W*JP.h/JP.w):W;
  c.width=W*dpr;c.height=H*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement),col=n=>cs.getPropertyValue(n).trim();
  const span=jp?JP.w*JP_M:5000,sc=W/span,X=m=>W/2+m*sc,Y=m=>H/2-m*sc;
  x.fillStyle=jp?"#ECE6DD":col("--bg");x.fillRect(0,0,W,H);
  x.font="11px "+getComputedStyle(document.body).fontFamily;
  if(jp){if(jpImg.complete&&jpImg.naturalWidth)x.drawImage(jpImg,0,0,W,H)}
  else{
    x.strokeStyle=col("--line");x.lineWidth=1;
    for(let m=-2000;m<=2000;m+=500){x.beginPath();x.moveTo(X(m),0);x.lineTo(X(m),H);x.moveTo(0,Y(m));x.lineTo(W,Y(m));x.stroke()}
    x.strokeStyle=col("--muted");x.beginPath();x.moveTo(X(0)-7,Y(0));x.lineTo(X(0)+7,Y(0));x.moveTo(X(0),Y(0)-7);x.lineTo(X(0),Y(0)+7);x.stroke();
  }
  const barM=jp?500*0.3048:1000,barLbl=jp?"500 ft":"1 km",bw=barM*sc;
  if(jp){x.fillStyle="rgba(255,255,255,.85)";x.fillRect(6,H-30,bw+16+x.measureText(barLbl).width*0,34)}
  x.strokeStyle=jp?"#333":col("--muted");x.fillStyle=jp?"#333":col("--muted");x.lineWidth=3;
  x.beginPath();x.moveTo(12,H-12);x.lineTo(12+bw,H-12);x.stroke();x.fillText(barLbl,12,H-18);
  const ps=pins();
  ps.forEach((a,i)=>ps.forEach((b,j)=>{if(j>i&&Math.hypot(a.x-b.x,a.y-b.y)<LINK_M){
    x.beginPath();x.moveTo(X(a.x),Y(a.y));x.lineTo(X(b.x),Y(b.y));
    if(jp){x.lineWidth=7;x.strokeStyle="rgba(255,255,255,.9)";x.stroke()}
    x.lineWidth=3;x.strokeStyle=col("--green");x.stroke()}}));
  gaps(ps).forEach(g=>{
    x.beginPath();x.moveTo(X(g.a.x),Y(g.a.y));x.lineTo(X(g.b.x),Y(g.b.y));
    x.setLineDash([]);x.lineWidth=7;x.strokeStyle="rgba(255,255,255,.9)";x.stroke();
    x.setLineDash([7,6]);x.lineWidth=3;x.strokeStyle="#C77A00";x.stroke();x.setLineDash([]);
    x.beginPath();x.arc(X(g.x),Y(g.y),11,0,7);x.fillStyle="rgba(255,255,255,.75)";x.fill();x.lineWidth=3;x.strokeStyle="#C77A00";x.stroke();
    const t="Gap "+Math.round(g.d*3.281)+" ft",tw=x.measureText(t).width;
    x.fillStyle="rgba(255,255,255,.9)";x.fillRect(X(g.x)+14,Y(g.y)-9,tw+8,18);x.fillStyle="#6B3B00";x.fillText(t,X(g.x)+18,Y(g.y)+4)});
  ps.forEach(p=>{x.beginPath();x.arc(X(p.x),Y(p.y),p.me?9:7,0,7);x.fillStyle=p.me?col("--bloom"):col("--green");x.fill();
    x.lineWidth=2.5;x.strokeStyle=jp?"#fff":col("--surface");x.stroke()});
  if(!ps.length){const t="No pins yet. Be the first.",tw=x.measureText(t).width;
    x.fillStyle="rgba(255,255,255,.9)";x.fillRect(W/2-tw/2-10,10,tw+20,26);
    x.fillStyle="#333";x.fillText(t,W/2-tw/2,27)}
}

/* ---------- Rendering + events ---------- */
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  $("#view").innerHTML=(demo?`<div class="note row" style="justify-content:space-between"><span><b>Judge demo.</b> Sample data. Nothing is saved or shown to neighbors.</span><button class="btn ghost" data-act="exitdemo">Exit demo</button></div>`:"")+{plan:planView,garden:gardenView,board:boardView,map:mapView}[tab]();
  head();foot();if(tab==="map")drawMap();
  const m=$("#map");if(m)m.addEventListener("click",ev=>{
    if(!S.checkedIn)return;
    const r=m.getBoundingClientRect();
    if(jpMode()){pend={map:"jp",u:(ev.clientX-r.left)/r.width,v:(ev.clientY-r.top)/r.height}}
    else{const sc=r.width/5000,g=geom();
      const mx=(ev.clientX-r.left-r.width/2)/sc,my=-(ev.clientY-r.top-r.height/2)/sc;
      pend={lat:g.lat0+my/g.ky,lng:g.lng0+mx/g.kx}}
    msg="";render()});
}
function go(t){tab=t;msg="";render()}
document.querySelector("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(b.dataset.tab)});

$("#view").addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="zipForm"){
    const z=$("#zip").value.trim(),n=($("#nick1").value||"").trim().slice(0,20);
    if(!n){msg="Pick a nickname. Please do not use your real name.";render();return}
    S.name=n;S.named=true;
    if(!ZIPS[z]){msg="PolliVerse is testing in "+Object.keys(ZIPS).join(", ")+". Check your ZIP code.";render();return}
    S.zip=z;if(S.step<2)S.step=2;vs=Math.max(vs,2);if(vs===1)vs=2;msg="";save();render()}
});
$("#view").addEventListener("input",e=>{if(e.target.id==="sNote")noteDraft=e.target.value});
$("#view").addEventListener("change",e=>{if(e.target.id==="photo"&&e.target.files[0])addPhoto(e.target.files[0])});
$("#view").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const a=b.dataset.act,v=b.dataset.v,id=b.dataset.id;
  if(a==="goto"){vs=+b.dataset.n;msg="";render()}
  else if(a==="tab")go(b.dataset.t);
  else if(a==="sun"){S.sun=v;prune();if(S.step<3)S.step=3;vs=3;save();render()}
  else if(a==="poll"){S.poll=S.poll.includes(v)?S.poll.filter(k=>k!==v):[...S.poll,v];prune();save();render()}
  else if(a==="toPlants"){if(S.step<4)S.step=4;vs=4;save();render()}
  else if(a==="pick"){S.plants=S.plants.some(p=>p.id===id)?S.plants.filter(p=>p.id!==id):[...S.plants,{id,method:"soil"}];save();render()}
  else if(a==="method"){const sp=S.plants.find(p=>p.id===id);if(sp){sp.method=v;save();render()}}
  else if(a==="toBuy"){if(S.step<5)S.step=5;vs=5;save();render();scrollTo(0,0)}
  else if(a==="finish"){S.planDone=true;vs=6;save();render();scrollTo(0,0)}
  else if(a==="edit"){S.planDone=false;vs=4;save();render()}
  else if(a==="rename"){const n=$("#nick").value.trim().slice(0,20);if(n){S.name=n;msg="Name saved.";save();render()}}
  else if(a==="checkin"){S.checkedIn=true;award("checkin","Came back after planting",10);save();render()}
  else if(a==="sight"){logSighting()}
  else if(a==="savepin"){if(!pend)return;const first=!S.pin;S.pin={...pend};pend=null;
    if(first)award("pin","Pinned where you planted",30);else msg="Pin moved.";save();render()}
  else if(a==="demo"){startDemo()}
  else if(a==="exitdemo"){exitDemo()}
  else if(a==="showpin"){S.showPin=S.showPin===false;save();render()}
  else if(a==="coord"){const m=$("#coord").value.match(/(-?\d+\.\d+)\s*[, ]\s*(-?\d+\.\d+)/),g=geom();
    if(!m){msg="Paste two numbers like 35.6540, -78.9890.";render();return}
    const lat=+m[1],lng=+m[2];
    if(Math.abs(lat-g.lat0)>0.05||Math.abs(lng-g.lng0)>0.06){msg="Those coordinates are too far from ZIP "+S.zip+".";render();return}
    pend={lat,lng};msg="";render()}
});

const demoPlayers=[
 {id:"d1",name:"Sample neighbor A",zip:"27562",plants:4,sightings:6,pts:150,pin:{map:"jp",u:0.575,v:0.455}},
 {id:"d2",name:"Sample neighbor B",zip:"27562",plants:3,sightings:3,pts:100,pin:{map:"jp",u:0.47,v:0.40}},
 {id:"d3",name:"Sample neighbor C",zip:"27562",plants:2,sightings:1,pts:40,pin:{map:"jp",u:0.30,v:0.62}}];
const roster=()=>demo?[...demoPlayers,{id:"me",...pub()}]:players;
function startDemo(){
  realState=S;realPlayers=players;demo=true;pend=null;msg="";
  S={...blank(),name:"Judge",named:true,zip:"27562",sun:"full",poll:["butterflies","bees"],
    plants:[{id:"purple-coneflower",method:"soil"},{id:"mountain-mint",method:"pot"},{id:"butterfly-weed",method:"pot"}],
    step:5,planDone:true,checkedIn:true,pin:{map:"jp",u:0.52,v:0.43},photoCount:0,pts:80,
    ledger:[{key:"sight",label:"Spotted a butterfly",pts:20},{key:"pin",label:"Pinned where you planted",pts:30},{key:"checkin",label:"Came back after planting",pts:10}].map(l=>({...l,ts:Date.now()})),
    sightings:[{day:today(),kind:"Butterfly",plant:"Purple coneflower",note:"Monarch",pts:20}]};
  photos=[];tab="garden";vs=6;render();scrollTo(0,0);
}
function exitDemo(){
  demo=false;S=realState||blank();players=realPlayers||players;photos=(lsGet()||{}).photos||[];
  vs=S.planDone?6:Math.min(S.step,5);tab="plan";msg="";render();scrollTo(0,0);
}
function logSighting(){
  const day=today(),kind=$("#sKind").value,plant=$("#sPlant").value,note=($("#sNote").value||"").trim().slice(0,80);
  const can=S.sightings.filter(s=>s.day===day&&s.pts>0).length<3,pts=can?20:0;
  S.sightings.unshift({day,kind,plant,note,pts});S.sightings=S.sightings.slice(0,100);noteDraft="";
  if(pts)award("sight","Spotted a "+kind.toLowerCase(),20);else msg="Sighting saved. You have reached 3 point sightings today.";
  save();render();
}
function addPhoto(f){
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{
    const k=Math.min(1,420/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);photos=[{d:c.toDataURL("image/jpeg",.68),ts:Date.now()},...photos].slice(0,3);
    if(S.photoCount<3){S.photoCount++;award("photo","Uploaded a planting photo",20)}
    save();render()};
  img.onerror=()=>{msg="That file could not be read as an image.";render()};
  img.src=url;
}
window.addEventListener("resize",()=>{if(tab==="map")drawMap()});

/* ---------- Boot ---------- */
(function start(){
  const l=lsGet();if(l&&l.S){S={...blank(),...l.S};photos=l.photos||[]}
  vs=Math.min(S.step,5);if(S.planDone)vs=6;
  flush();render();
  (async()=>{
    try{
      const [app,auth,fs]=await Promise.all([import(FB+"firebase-app.js"),import(FB+"firebase-auth.js"),import(FB+"firebase-firestore.js")]);
      const a=app.initializeApp(firebaseConfig);
      fsDb=fs.getFirestore(a);fb=fs;
      uid=(await auth.signInAnonymously(auth.getAuth(a))).user.uid;
    }catch(e){fb=null;fsDb=null;uid=null;db=null;return}
    db=true;mode="shared";
    try{const ps=await fb.getDoc(fb.doc(fsDb,"users/"+uid));
      if(ps.exists()&&!demo){S={...blank(),...ps.data()};vs=Math.min(S.step,5);if(S.planDone)vs=6}}catch(e){}
    flush();
    fb.onSnapshot(fb.query(fb.collection(fsDb,"players"),fb.orderBy("pts","desc"),fb.limit(100)),s=>{
      const arr=s.docs.map(d=>({id:d.id,...d.data()}));if(demo)realPlayers=arr;else players=arr;
      if(tab==="board"||tab==="map")render();
    },()=>{mode="local";foot()});
    render();
  })();
})();
</script>
